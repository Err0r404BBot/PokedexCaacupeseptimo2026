<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokédex Caacupe</title>
  <style>
    * { box-sizing: border-box; margin: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #4040F2;
      color: #f5f5f5;
      min-height: 100vh;
    }

    /* ========================================
       INTRO · Pokebola que cae y se abre
       ======================================== */
    .intro {
      position: fixed;
      inset: 0;
      background: #4040F2;;
      display: grid;
      place-items: center;
      z-index: 100;
      animation: introOut 0.6s 1.3s ease-in forwards;
    }

    @keyframes introOut {
      to { opacity: 0; visibility: hidden; }
    }

    .ball {
      position: relative;
      width: 140px;
      height: 140px;
      animation: ballDrop 0.6s cubic-bezier(.34, 1.56, .64, 1);
    }

    @keyframes ballDrop {
      from { transform: translateY(-260px); opacity: 0; }
      to   { transform: translateY(0);      opacity: 1; }
    }

    .ball-top,
    .ball-bottom {
      position: absolute;
      left: 0;
      width: 140px;
      height: 70px;
      border: 6px solid #111;
    }

    .ball-top {
      top: 0;
      background: #ee1515;
      border-radius: 140px 140px 0 0;
      border-bottom: none;
      transform-origin: bottom center;
      animation: openTop 0.35s 0.9s ease-out forwards;
    }

    .ball-bottom {
      bottom: 0;
      background: #f5f5f5;
      border-radius: 0 0 140px 140px;
      border-top: none;
      transform-origin: top center;
      animation: openBottom 0.35s 0.9s ease-out forwards;
    }

    @keyframes openTop    { to { transform: rotate(-110deg) translateY(-8px); } }
    @keyframes openBottom { to { transform: rotate(110deg)  translateY(8px);  } }

    .ball-center {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 40px;
      height: 40px;
      margin: -20px;
      border-radius: 50%;
      background: white;
      border: 5px solid #111;
      z-index: 2;
      animation: centerFade 0.25s 0.9s forwards;
    }

    @keyframes centerFade {
      to { transform: scale(0); opacity: 0; }
    }

    .flash {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100px;
      height: 100px;
      margin: -50px;
      border-radius: 50%;
      background: #fff;
      transform: scale(0);
      z-index: 3;
      animation: flash 0.6s 0.95s ease-out forwards;
    }

    @keyframes flash {
      60%  { opacity: 1; }
      100% { transform: scale(30); opacity: 0; }
    }

    /* ========================================
       UTILIDADES
       ======================================== */
    .oculto { display: none !important; }

    /* ========================================
       MENÚ DE TURNOS (Pantalla Inicial)
       ======================================== */
    .menu {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      opacity: 0;
      animation: fadeIn 0.8s 1.4s ease-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo {
      width: 100%;
      max-width: 450px;
      height: auto;
      margin-bottom: 40px;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.4));
    }

    .botones-turnos {
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn-turno {
      display: flex;
      align-items: center;
      gap: 15px;
      background: #070cff;
      border: 3px solid #1e4b99;
      padding: 15px 30px;
      border-radius: 20px;
      color: white;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .btn-turno:hover {
      transform: translateY(-5px) scale(1.05);
      border-color: #fff;
      box-shadow: 0 12px 25px rgba(0,0,0,0.5);
    }

    /* Pokebolas de los botones */
    .pokebola-mini {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      border: 3px solid #111;
      position: relative;
      overflow: hidden;
      background: #f5f5f5; 
    }

    .pokebola-mini::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 50%;
      border-bottom: 3px solid #111;
    }

    .pokebola-mini::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 14px;
      height: 14px;
      background: white;
      border: 3px solid #111;
      border-radius: 50%;
      z-index: 2;
    }

    /* Colores personalizados de las Pokebolas */
    .pk-manana::before { background: #FFCB05; } /* Amarillo */
    .pk-tarde::before  { background: #3B4CCA; } /* Azul */

    /* ========================================
       GALERÍA Y HEADER
       ======================================== */
    .seccion-galeria {
      animation: fadeIn 0.5s ease-out forwards;
    }

    .header-galeria {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      background: #222226;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .btn-volver {
      background: #ee1515;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 99px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-volver:hover { background: #b81010; }

    .titulo-turno {
      font-size: 1.2rem;
      color: #FFCB05;
    }

    .galeria {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 18px;
      padding: 28px 24px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .carta-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
      opacity: 0;
      animation: cardPop 0.5s ease-out forwards;
    }

    .carta {
      aspect-ratio: 63 / 88;
      border: none;
      padding: 0;
      background: #2a2a30;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0,0,0,.35);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .carta:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(238,21,21,.35);
    }

    .carta img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .autor {
      font-size: 0.8rem;
      color: #b8b8c0;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    @keyframes cardPop {
      0%   { transform: scale(0.1) rotate(-15deg); opacity: 0; }
      60%  { transform: scale(1.08) rotate(2deg);  opacity: 1; }
      100% { transform: scale(1) rotate(0);        opacity: 1; }
    }

    /* ========================================
       ZOOM
       ======================================== */
    .zoom {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.9);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 200;
      cursor: zoom-out;
    }

    .zoom img {
      max-width: min(90vw, 500px);
      max-height: 85vh;
      border-radius: 14px;
      box-shadow: 0 20px 60px rgba(0,0,0,.6);
      animation: zoomPop .25s ease;
    }

    @keyframes zoomPop {
      from { transform: scale(.9); opacity: 0; }
      to   { transform: scale(1);  opacity: 1; }
    }

    /* Accesibilidad */
    @media (prefers-reduced-motion: reduce) {
      .intro, .menu, .seccion-galeria { opacity: 1; animation: none; }
      .carta-item { opacity: 1; animation: none; }
      .intro { display: none; }
    }

    @media (max-width: 600px) {
      .botones-turnos { flex-direction: column; width: 100%; max-width: 300px; }
      .btn-turno { justify-content: center; width: 100%; }
    }
  </style>
</head>
<body>

  <!-- 1. Animación de Pokebola -->
  <div class="intro">
    <div class="ball">
      <div class="ball-top"></div>
      <div class="ball-bottom"></div>
      <div class="ball-center"></div>
      <div class="flash"></div>
    </div>
  </div>

  <!-- 2. Menú de Turnos -->
  <section id="menu-turnos" class="menu">
    <img src="img/logo.png" alt="Pokédex Caacupe" class="logo">
    
    <div class="botones-turnos">
      <!-- Botón Mañana -->
      <button class="btn-turno btn-manana" data-turno="mañana">
        <div class="pokebola-mini pk-manana"></div>
        Turno Mañana
      </button>
      
      <!-- Botón Tarde -->
      <button class="btn-turno btn-tarde" data-turno="tarde">
        <div class="pokebola-mini pk-tarde"></div>
        Turno Tarde
      </button>
    </div>
  </section>

  <!-- 3. Sección de Galería -->
  <section id="seccion-galeria" class="seccion-galeria oculto">
    <header class="header-galeria">
      <button id="btn-volver" class="btn-volver">← Volver al menú</button>
      <h2 id="titulo-turno" class="titulo-turno">Turno</h2>
    </header>

    <main id="galeria" class="galeria"></main>
  </section>

  <!-- 4. Visor de imagen -->
  <div id="zoom" class="zoom oculto">
    <img id="zoom-img" alt="">
  </div>

  <script>
    // -------- Datos (Editar acá agregando el campo "turno") --------
    // turno: 'mañana' o 'tarde'
    const cartas = [
      {archivo: 'dodo.png', autor: 'Valentino Alonso',turno: 'mañana' },
      {archivo: 'guara-malvinas.png', autor: 'Luna Miranda',turno: 'mañana' },
      {archivo: 'mamut-lanudo-1.png', autor: 'Byron Sudo ', turno: 'mañana'  },
      {archivo: 'bandicut.png', autor: 'Benjamín Valdez ', turno: 'mañana' }
      {archivo: 'dientes-de-sable-1.png', autor: 'Agustín Cortés', turno: 'mañana' }
      {archivo: 'Tilacino.png', autor: 'Facundo Benitez', turno: 'mañana' }
      { archivo: 'dientes-de-sable-2.png', autor: 'Genesis Mancuello',turno: 'mañana' },
      { archivo: 'megalopodis.png', autor: 'Oliver Sanchez',turno: 'mañana'},
      { archivo: 'foca-monja.png', autor: 'Leire Rodríguez',turno: 'mañana' },
      { archivo: 'rana-dorada.png', autor: 'Rocio Delvalle',turno: 'mañana'},
      { archivo: 'megalodon.png', autor: 'Ian Duarte',turno: 'mañana'},
      { archivo: 'pez-remo-chino-1.png', autor: 'Esteban Duarte',turno: 'mañana'},
      { archivo: 'tortuga.png', autor: 'Génesis Aguinagalde',turno: 'mañana'},
      { archivo: 'pez-remo-chino-2.png', autor: 'Elizabeth Martinez',turno: 'mañana' },
      { archivo: 'lobo-malvinas.png', autor: 'Lian Gutierrez',turno: 'mañana'},
      { archivo: 'Pinguino.png', autor: 'Ian Ferreyra',turno: 'mañana'},
      { archivo: 'Tigre-3png', autor: 'León Martínez',turno: 'mañana'},
      { archivo: 'podiceps.png', autor: 'Franco Paiva',turno: 'mañana' },

    
       {archivo: 'vaca-marina.png', autor: 'Ana',turno: 'tarde'  },
      // ...agrega todas las que tengas
    ];

    // -------- Referencias al DOM --------
    const menuTurnos = document.getElementById('menu-turnos');
    const seccionGaleria = document.getElementById('seccion-galeria');
    const galeria = document.getElementById('galeria');
    const tituloTurno = document.getElementById('titulo-turno');
    const btnVolver = document.getElementById('btn-volver');
    
    const zoom    = document.getElementById('zoom');
    const zoomImg = document.getElementById('zoom-img');

    // -------- Funciones --------
    
    // Filtrar y mostrar galería
    function mostrarGaleria(turno) {
      // 1. Ocultar menú, mostrar galería
      menuTurnos.classList.add('oculto');
      seccionGaleria.classList.remove('oculto');
      
      // 2. Poner el título correcto
      tituloTurno.textContent = turno === 'mañana' ? 'Turno Mañana' : 'Turno Tarde';

      // 3. Filtrar cartas de ese turno
      const cartasTurno = cartas.filter(c => c.turno === turno);

      // 4. Renderizar
      galeria.innerHTML = cartasTurno.map(c => {
        const nombre = nombreDesdeArchivo(c.archivo);
        const autorHtml = c.autor ? `<p class="autor">por ${c.autor}</p>` : '';
        
        return `
          <div class="carta-item">
            <button class="carta" data-archivo="${c.archivo}" title="${nombre}">
              <img src="img/${c.archivo}" alt="Carta de ${nombre}" loading="lazy">
            </button>
            ${autorHtml}
          </div>
        `;
      }).join('');

      // 5. Aplicar animación escalonada (rápida porque ya están dentro del sitio)
      galeria.querySelectorAll('.carta-item').forEach((el, i) => {
        el.style.animationDelay = (i * 0.05) + 's';
      });
    }

    // Eventos de los botones de turno
    document.querySelectorAll('.btn-turno').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const turno = e.currentTarget.dataset.turno;
        mostrarGaleria(turno);
      });
    });

    // Botón Volver
    btnVolver.addEventListener('click', () => {
      seccionGaleria.classList.add('oculto');
      menuTurnos.classList.remove('oculto');
    });

    // Lógica del Zoom
    galeria.addEventListener('click', e => {
      const carta = e.target.closest('.carta');
      if (!carta) return;
      zoomImg.src = 'img/' + carta.dataset.archivo;
      zoomImg.alt = carta.title;
      zoom.classList.remove('oculto');
    });

    zoom.addEventListener('click', () => zoom.classList.add('oculto'));
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') zoom.classList.add('oculto');
    });

    // Utilidad
    function nombreDesdeArchivo(archivo) {
      const base = archivo.replace(/\.(jpg|jpeg|png|webp)$/i, '');
      const match = base.match(/-([^-]+)$/);
      const nombre = match ? match[1] : base;
      return nombre.charAt(0).toUpperCase() + nombre.slice(1);
    }
  </script>
</body>
</html>
